# Copy to /etc/nginx/sites-available/mute.ac and symlink sites-enabled.
# TLS paths assume Certbot layout. Adjust ssl_certificate* if needed.

server {
    listen 80;
    listen [::]:80;
    server_name mute.ac;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mute.ac;

    ssl_certificate /etc/letsencrypt/live/mute.ac/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mute.ac/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
