# Copy to /etc/nginx/sites-available/mute.ac and symlink sites-enabled.
# TLS paths assume Certbot layout. Adjust ssl_certificate* if needed.
#
# First-time setup: use HTTP-only bootstrap, run certbot for mute.ac, then apply this file.
# Cert must cover both hosts: certbot --nginx -d mute.ac -d www.mute.ac --expand

server {
    listen 80;
    listen [::]:80;
    server_name mute.ac www.mute.ac;
    return 301 https://mute.ac$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mute.ac;

    ssl_certificate /etc/letsencrypt/live/mute.ac/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mute.ac/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mute.ac$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mute.ac;

    ssl_certificate /etc/letsencrypt/live/mute.ac/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mute.ac/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Сжатие для проксируемых ответов (HTML/JSON/SVG/XML)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Хэшированные ассеты Next.js — кэшировать навсегда
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
